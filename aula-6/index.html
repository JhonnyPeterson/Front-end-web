<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="icon" href="icons/favicon.ico" type="image/x-icon">
    <title>Conhecendo os Displays</title>
</head>
<body>
    <header>
        <h1>Conhecendo os Displays</h1>
    </header>
    <main>
        <section>
            <h2>Display block</h2>
            <div class="container-block">
                <div class="item">Item 1</div>
                <div class="item">Item 2</div>
                <div class="item">Item 3</div>
            </div>
            <p>Elementos são blocos que ocupam a linha verde</p>
        </section>
        <h2>Display inline</h2>
        <div class="container-inline">
            <span class="item">Item 1</span>
            <span class="item">Item 2</span>
            <span class="item">Item 3</span>
        </div>
        <p>Elementos ficam em linha e respeitam o tamanho do conteúdo textual</p>
    </main>
    <footer>
        <p>Projeto de compreensão de displays no CSS</p>
    </footer>
</body>

</html>
