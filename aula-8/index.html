<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/global.css">
    <script src="scripts/index.js" defer></script>
    <title>Formulário validado</title>
</head>
<body>
    <header>
        <h1>Formulário validado</h1>
    </header>
    <main>
        <h2>Cadastro</h2>
        <form id="cadastro" novalidate onsubmit="executar(event)">

            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" placeholder="Ex: Cristiano Ronaldo dos Santos Aveiro">
            <p id="erro-nome" class="oculto"></p>

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14">
            <p id="erro-cpf" class="oculto"></p>

            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="nome@exemplo.com">
            <p id="erro-email" class="oculto"></p>

            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" placeholder="(00) 00000-0000" maxlength="15">
            <p id="erro-telefone" class="oculto"></p>

            <label for="nascimento">Data de nascimento:</label>
            <input type="date" id="nascimento">
            <p id="erro-nascimento" class="oculto"></p>

            <label for="cep">CEP:</label>
            <input type="text" id="cep" placeholder="00000-000" maxlength="9">
            <p id="erro-cep" class="oculto"></p>

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade">
            <p id="erro-cidade" class="oculto"></p>

            <label for="estado">Estado:</label>
            <select id="estado">
                <option value="">Selecione...</option>
                <option value="AC">AC</option>
                <option value="AL">AL</option>
                <option value="AP">AP</option>
                <option value="AM">AM</option>
                <option value="BA">BA</option>
                <option value="CE">CE</option>
                <option value="DF">DF</option>
                <option value="ES">ES</option>
                <option value="GO">GO</option>
                <option value="MA">MA</option>
                <option value="MT">MT</option>
                <option value="MS">MS</option>
                <option value="MG">MG</option>
                <option value="PA">PA</option>
                <option value="PB">PB</option>
                <option value="PR">PR</option>
                <option value="PE">PE</option>
                <option value="PI">PI</option>
                <option value="RJ">RJ</option>
                <option value="RN">RN</option>
                <option value="RS">RS</option>
                <option value="RO">RO</option>
                <option value="RR">RR</option>
                <option value="SC">SC</option>
                <option value="SP">SP</option>
                <option value="SE">SE</option>
                <option value="TO">TO</option>
            </select>
            <p id="erro-estado" class="oculto"></p>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" placeholder="Mínimo de 8 caracteres">
            <p id="erro-senha" class="oculto"></p>

            <label for="confirmar-senha">Confirmar senha:</label>
            <input type="password" id="confirmar-senha">
            <p id="erro-confirmar-senha" class="oculto"></p>

            <label class="termos">
                <input type="checkbox" id="termos">
                Li e aceito os termos
            </label>
            <p id="erro-termos" class="oculto"></p>

            <button type="submit">Enviar</button>
            <p id="concluido" class="oculto"></p>

        </form>
    </main>

    <footer>
        <p>Atividade da aula 8</p>
    </footer>
</body>
</html>
